<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'"
    />

    <title>ERP Support Generator</title>

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <span class="eyebrow"> ERP SUPPORT </span>

          <h1>Support Generator</h1>

          <p>
            تفعيل البرنامج واسترجاع كلمة مرور المدير باستخدام Ed25519 Signed
            Tokens.
          </p>
        </div>

        <div class="security-badge">🔐 Offline Signing</div>
      </header>

      <section class="key-card">
        <div>
          <strong> Support Private Key </strong>

          <div id="privateKeyLabel" class="muted">لم يتم اختيار مفتاح</div>
        </div>

        <button id="chooseKeyButton" class="button secondary" type="button">
          اختيار Private Key
        </button>
      </section>

      <nav class="tabs">
        <button id="activationTab" class="tab active" type="button">
          تفعيل البرنامج
        </button>

        <button id="recoveryTab" class="tab" type="button">
          استرجاع المدير
        </button>
      </nav>

      <section id="activationPanel" class="panel">
        <h2>إنشاء Activation Token</h2>

        <label>
          Device Code

          <input
            id="activationDevice"
            autocomplete="off"
            placeholder="1234-ABCD-5678-EFGH"
          />
        </label>

        <button
          id="generateActivationButton"
          class="button primary"
          type="button"
        >
          إنشاء كود التفعيل
        </button>

        <div id="activationResult" class="result hidden">
          <div class="result-title">Activation Token</div>

          <textarea id="activationToken" readonly></textarea>

          <button
            id="copyActivationButton"
            class="button secondary"
            type="button"
          >
            نسخ الكود
          </button>

          <div id="activationMeta" class="meta"></div>
        </div>
      </section>

      <section id="recoveryPanel" class="panel hidden">
        <h2>إنشاء Admin Recovery Token</h2>

        <div class="grid-two">
          <label>
            Device Code

            <input
              id="recoveryDevice"
              autocomplete="off"
              placeholder="1234-ABCD-5678-EFGH"
            />
          </label>

          <label>
            Request ID

            <input
              id="recoveryRequest"
              autocomplete="off"
              placeholder="1111-2222-3333-4444"
            />
          </label>
        </div>

        <div class="grid-two">
          <label>
            Admin Username

            <input
              id="recoveryUsername"
              autocomplete="off"
              placeholder="admin"
            />
          </label>

          <label>
            الصلاحية بالدقائق

            <input
              id="recoveryMinutes"
              type="number"
              min="1"
              max="15"
              value="15"
            />
          </label>
        </div>

        <button
          id="generateRecoveryButton"
          class="button primary"
          type="button"
        >
          إنشاء Recovery Code
        </button>

        <div id="recoveryResult" class="result hidden">
          <div class="result-title">Recovery Token</div>

          <textarea id="recoveryToken" readonly></textarea>

          <button
            id="copyRecoveryButton"
            class="button secondary"
            type="button"
          >
            نسخ الكود
          </button>

          <div id="recoveryMeta" class="meta"></div>
        </div>
      </section>

      <div id="message" class="message hidden"></div>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>

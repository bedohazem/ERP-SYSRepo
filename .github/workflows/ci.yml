name: ERP CI

on:
  push:
  pull_request:

concurrency:
  group: erp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and Electron E2E

    runs-on: windows-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare SQLite for Node tests
        run: npm run test:prepare

      - name: Typecheck
        run: npm run typecheck

      - name: Repository and IPC tests
        run: npm test -- --run

      - name: Build renderer
        run: npm run build:renderer

      - name: Build main process
        run: npm run build:main

      - name: Prepare SQLite for Electron
        run: npm run electron:prepare

      - name: Electron E2E smoke
        run: npm run test:e2e
